<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardBunny - Web Mockup</title>
<style>

    :root {
        --bg-main: #FFFFFF;
        --bg-panel: #F4F4F0;
        --bg-input: #FFFFFF;
        --bg-input-alt: #EAEAEA;
        --bg-log: #F8F8F8;
        --accent: #FF3366;
        --accent-hover: #FF1A53;
        --accent-blue: #3366FF;
        --accent-yellow: #FFD13B;
        --text-primary: #111111;
        --text-secondary: #222222;
        --text-muted: #444444;
        --border-color: #000000;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Space Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: #121212;
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        min-height: 100vh;
        gap: 30px;
        padding: 40px;
    }

    /* Base Window */
    .window {
        background-color: var(--bg-main);
        border: 4px solid var(--border-color);
        box-shadow: 12px 12px 0px var(--border-color);
        position: relative;
        display: flex;
        flex-direction: column;
    }

    /* MAIN APP WINDOW */
    .main-app {
        width: 480px;
        height: 740px;
        padding: 25px;
    }

    /* Floating Buttons (No Toolbar) */
    .floating-header {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 10;
    }

    .icon-btn {
        background: var(--bg-main);
        border: 3px solid var(--border-color);
        box-shadow: 4px 4px 0px var(--border-color);
        color: var(--text-primary);
        cursor: pointer;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s ease;
    }

    .icon-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px var(--border-color);
    }
    
    .icon-btn.close-btn:hover {
        background-color: var(--accent);
        color: white;
    }
    .icon-btn.settings-btn:hover {
        background-color: var(--bg-panel);
    }

    /* Branding */
    .app-brand {
        margin-top: 15px;
        margin-bottom: 30px;
        padding-right: 100px;
    }
    .app-brand h1 {
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -1px;
        line-height: 1.1;
    }

    /* Inputs */
    .input-row {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        width: 100%;
    }

    .row-icon {
        width: 40px;
        height: 40px;
        margin-right: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--accent-yellow);
        border: 3px solid var(--border-color);
        box-shadow: 3px 3px 0px var(--border-color);
    }

    .row-icon.blue { background: var(--accent-blue); color: white; }
    .row-icon.pink { background: var(--accent); color: white; }

    .ctk-entry, .ctk-combo {
        flex: 1;
        height: 50px;
        background-color: var(--bg-input);
        border: 3px solid var(--border-color);
        box-shadow: 4px 4px 0px var(--border-color);
        color: var(--text-primary);
        font-size: 15px;
        font-weight: bold;
        padding: 0 15px;
        outline: none;
        transition: all 0.1s ease;
    }
    
    .ctk-entry:focus, .ctk-combo:focus {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px var(--border-color);
    }
    
    .ctk-combo {
        appearance: none;
        cursor: pointer;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 15px top 50%;
        background-size: 12px auto;
    }

    .btn-small {
        background-color: var(--accent-blue);
        color: white;
        border: 2px solid var(--border-color);
        box-shadow: 2px 2px 0px var(--border-color);
        height: 32px;
        padding: 0 12px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        margin: 0 5px;
    }
    .btn-small:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px var(--border-color);
    }

    .file-label {
        flex: 1;
        font-size: 13px;
        font-weight: bold;
        color: var(--text-muted);
        margin: 0 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .btn-close {
        background: var(--accent);
        color: white;
        border: 2px solid var(--border-color);
        box-shadow: 2px 2px 0px var(--border-color);
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .btn-close:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px var(--border-color);
    }

    .status-text {
        font-size: 14px;
        font-weight: 900;
        color: var(--text-primary);
        text-transform: uppercase;
        margin-bottom: 8px;
        margin-top: 10px;
        letter-spacing: 0.5px;
    }

    .progress-bar {
        height: 12px;
        background-color: var(--bg-input);
        border: 3px solid var(--border-color);
        margin-bottom: 20px;
        position: relative;
    }

    .progress-fill {
        height: 100%;
        width: 45%;
        background-color: var(--accent-blue);
        border-right: 3px solid var(--border-color);
    }

    .stepper {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }

    .step {
        flex: 1;
        height: 35px;
        background-color: var(--bg-main);
        border: 3px solid var(--border-color);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        box-shadow: 3px 3px 0px var(--border-color);
    }

    .step.active {
        background-color: var(--accent);
        color: white;
    }

    .btn-play {
        width: 100%;
        height: 70px;
        background-color: var(--accent-yellow);
        border: 4px solid var(--border-color);
        box-shadow: 6px 6px 0px var(--border-color);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 25px;
        transition: all 0.1s ease;
    }

    .btn-play:active {
        transform: translate(6px, 6px);
        box-shadow: 0px 0px 0px var(--border-color);
    }

    .log-box {
        flex: 1;
        background-color: var(--bg-log);
        border: 3px solid var(--border-color);
        box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
        padding: 15px;
        font-family: Consolas, monospace;
        font-size: 12px;
        font-weight: bold;
        color: var(--text-secondary);
        overflow-y: auto;
        resize: none;
        outline: none;
    }

    /* SETTINGS WINDOW */
    .settings-app {
        width: 540px;
        height: 640px;
        padding: 30px;
    }

    .title {
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -1px;
        margin-bottom: 5px;
    }
    
    .subtitle {
        font-size: 14px;
        font-weight: bold;
        color: var(--text-muted);
        margin-bottom: 25px;
        border-bottom: 4px solid var(--border-color);
        padding-bottom: 15px;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .tab {
        flex: 1;
        text-align: center;
        padding: 12px 0;
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        background-color: var(--bg-main);
        border: 3px solid var(--border-color);
        box-shadow: 3px 3px 0px var(--border-color);
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.1s ease;
    }

    .tab.active {
        background-color: var(--text-primary);
        color: white;
        transform: translate(3px, 3px);
        box-shadow: 0px 0px 0px var(--border-color);
    }

    .tab-content {
        background-color: var(--bg-panel);
        border: 3px solid var(--border-color);
        box-shadow: 6px 6px 0px var(--border-color);
        padding: 25px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .settings-row {
        margin-bottom: 20px;
    }
    .settings-row-inline {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }
    
    .settings-row-inline > div {
        flex: 1;
    }

    .settings-label {
        display: block;
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    .settings-input, .settings-combo {
        width: 100%;
        height: 45px;
        background-color: var(--bg-input);
        border: 3px solid var(--border-color);
        box-shadow: 3px 3px 0px var(--border-color);
        color: var(--text-primary);
        padding: 0 12px;
        font-size: 14px;
        font-weight: bold;
        outline: none;
    }
    
    .settings-input:focus, .settings-combo:focus {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0px var(--border-color);
    }

    .footer {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 25px;
    }

    .btn-footer {
        height: 45px;
        border: 3px solid var(--border-color);
        box-shadow: 4px 4px 0px var(--border-color);
        cursor: pointer;
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        transition: all 0.1s ease;
    }
    .btn-footer:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px var(--border-color);
    }

    .btn-cancel {
        width: 120px;
        background-color: var(--accent);
        color: white;
    }

    .btn-save {
        width: 140px;
        background-color: var(--accent-blue);
        color: white;
    }

</style>
</head>
<body>

    <!-- MAIN APP MOCKUP -->
    <div class="window main-app">
        <!-- Floating Stylized Buttons, NO TOOLBAR -->
        <div class="floating-header">
            <button class="icon-btn settings-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
            <button class="icon-btn close-btn" style="font-size: 24px; font-weight: bold; line-height: 1;">×</button>
        </div>

        <div class="app-brand">
            <h1>Card<br>Bunny</h1>
        </div>

        <div class="input-row">
            <div class="row-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </div>
            <input type="text" class="ctk-entry" placeholder="PASTE YOUTUBE LINK...">
        </div>

        <!-- Discrete Local Files approach fitting same space as other fields -->
        <div class="input-row">
            <div class="row-icon blue">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </div>
            <div class="ctk-entry" style="display: flex; align-items: center; padding: 0 5px; gap: 5px;">
                <button class="btn-small">Select Video</button>
                <div class="file-label">C:\Videos\Matrix.mp4</div>
                <button class="btn-close">×</button>
            </div>
        </div>

        <div class="input-row">
            <div class="row-icon blue">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </div>
            <div class="ctk-entry" style="display: flex; align-items: center; padding: 0 5px; gap: 5px;">
                <button class="btn-small">Select Subtitle</button>
                <div class="file-label" style="opacity: 0.5;">NOT SELECTED</div>
            </div>
        </div>

        <div class="input-row">
            <div class="row-icon pink">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            </div>
            <select class="ctk-combo">
                <option>LANGUAGES::ENGLISH</option>
                <option>LANGUAGES::SPANISH</option>
            </select>
        </div>

        <div class="input-row" style="margin-bottom: 25px;">
            <div class="row-icon pink">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            </div>
            <select class="ctk-combo">
                <option>CARDBUNNY MODEL</option>
                <option>BASIC (AND REVERSED)</option>
            </select>
        </div>

        <div class="status-text">Status: Transcribing Audio...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="stepper">
            <div class="step">1. Down</div>
            <div class="step active">2. AI</div>
            <div class="step">3. Media</div>
            <div class="step">4. Anki</div>
        </div>

        <button class="btn-play">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="black" stroke="black" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>

        <textarea class="log-box" readonly>CONNECTING TO ANKI...
READY TO PROCESS VIDEOS.

URL: HTTPS://YOUTUBE.COM/WATCH?V=EXAMPLE

STATUS: INITIALIZING PIPELINE...
> downloading video...
> preparing whisper model...
> transcription_progress: 45% | audio 00:01:23/00:03:00</textarea>
    </div>

    <!-- SETTINGS MOCKUP -->
    <div class="window settings-app">
        <div class="floating-header">
            <button class="icon-btn close-btn" style="font-size: 24px; font-weight: bold; line-height: 1;">×</button>
        </div>
        
        <div class="title">Settings</div>
        <div class="subtitle">INTEGRATIONS USED IN PROCESSING</div>

        <div class="tabs">
            <div class="tab">Anki</div>
            <div class="tab active">Local AI</div>
            <div class="tab">Languages</div>
        </div>

        <div class="tab-content">
            <div class="settings-row">
                <label class="settings-label">OPENAI COMPATIBLE ENDPOINT</label>
                <input type="text" class="settings-input" value="http://localhost:11434/v1">
            </div>
            <div class="settings-row">
                <label class="settings-label">TRANSLATION MODEL</label>
                <input type="text" class="settings-input" value="llama3:8b">
            </div>
            <div class="settings-row">
                <label class="settings-label">API KEY</label>
                <input type="password" class="settings-input" value="12345">
            </div>
            <div class="settings-row">
                <label class="settings-label">WHISPER MODEL</label>
                <select class="settings-combo">
                    <option>base</option>
                    <option>small</option>
                    <option selected>medium</option>
                    <option>large-v3</option>
                </select>
            </div>
            <div class="settings-row-inline">
                <div>
                    <label class="settings-label">DEVICE</label>
                    <select class="settings-combo">
                        <option>cpu</option>
                        <option selected>cuda</option>
                    </select>
                </div>
                <div>
                    <label class="settings-label">PRECISION</label>
                    <select class="settings-combo">
                        <option>int8</option>
                        <option selected>float16</option>
                    </select>
                </div>
                <div style="flex: 0.7;">
                    <label class="settings-label">THREADS</label>
                    <input type="text" class="settings-input" value="4">
                </div>
            </div>
        </div>

        <div class="footer" style="justify-content: space-between;">
            <div style="display: flex; gap: 10px;">
                <button class="btn-footer" style="width: 100px; background-color: var(--bg-main); color: var(--text-primary);">IMPORT</button>
                <button class="btn-footer" style="width: 100px; background-color: var(--bg-main); color: var(--text-primary);">EXPORT</button>
            </div>
            <div style="display: flex; gap: 15px;">
                <button class="btn-footer btn-cancel">CANCEL</button>
                <button class="btn-footer btn-save">SAVE</button>
            </div>
        </div>
    </div>

</body>
</html>
